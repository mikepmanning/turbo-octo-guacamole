spring.application.name=RecipeHome

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recipehome}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Schema: Flyway owns it (src/main/resources/db/migration, run at startup). Hibernate only checks that the
# entities match the tables (validate) and fails startup if they don't: add a migration for every entity change.
# A database that already has tables but no Flyway history (built by ddl-auto=update before Flyway) is
# baselined at V1, the schema as it was then, and continues from V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Lazy collections and references (a recipe's steps, ingredients, categories, creator...) load for up to 100 entities
# in one query instead of one query each, so listing N recipes takes a handful of queries rather than ~5N.
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# No database session held open while the response is written: services and controllers load what they need inside
# their transactions (controllers that map entities to DTOs are @Transactional).
spring.jpa.open-in-view=false

# Logging
logging.level.root=INFO
logging.level.com.recipehome.api=${LOG_LEVEL_APP:INFO}
logging.level.com.recipehome.api.alexa=${LOG_LEVEL_ALEXA:DEBUG}
# SQL logging is off by default: it writes every statement on every request. LOG_LEVEL_SQL=DEBUG shows the
# statements; LOG_LEVEL_SQL_PARAMS=TRACE also shows their values (including emails and password hashes, so only locally).
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${LOG_LEVEL_SQL_PARAMS:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# File Logging
logging.file.name=${LOG_FILE_PATH:logs/recipehome.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=100MB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Sample Data
# Loads the 86 sample recipes in src/main/resources/seed/recipes.json at startup,
# only into an empty database (it never adds to or changes existing recipes).
# On by default while in development; set SEED_DATA=false to turn it off.
recipehome.seed.enabled=${SEED_DATA:true}
# Also add the sample recipes missing from a database that already has recipes (by title). Off by default;
# turn it on for a single run, e.g. SEED_TOP_UP=true mvnw spring-boot:run.
recipehome.seed.top-up=${SEED_TOP_UP:false}

# Login tokens (JWT)
# JWT_SECRET signs the tokens: at least 32 characters, kept secret. When it isn't set, a random key is
# made at startup, so everyone has to log in again after each restart (fine for development).
recipehome.jwt.secret=${JWT_SECRET:}
# How long a login lasts before the user has to log in again (e.g. 7d, 12h).
recipehome.jwt.expiration=${JWT_EXPIRATION:7d}

# Alexa Configuration
alexa.skill-id=${ALEXA_SKILL_ID:}

spring.config.import= optional:file:.env[.properties]
