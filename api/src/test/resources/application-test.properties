# Test profile: activated with @ActiveProfiles("test") on @SpringBootTest classes.
# Layers on top of src/main/resources/application.properties and replaces the
# PostgreSQL connection with an in-memory H2 database, so tests need no running
# database and never touch the developer's local recipehome DB from .env.

spring.datasource.url=jdbc:h2:mem:recipehome;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Fresh schema per test context, built from the entities.
spring.jpa.hibernate.ddl-auto=create-drop

# application.properties pins PostgreSQLDialect; use the H2 dialect here.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
